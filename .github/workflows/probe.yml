# 量 19 路每手 AI 時間（找後盤變慢的原因）
name: AI 速度量測
on:
  workflow_dispatch:
    inputs:
      lvs:
        default: '1,6,9,12,13,20'
      page:
        default: 'site2.html'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p out && node sim/probe.js ${{ github.event.inputs.page }} ${{ github.event.inputs.lvs }} out/probe.jsonl || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: out/
