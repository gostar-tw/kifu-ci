# 智多星 AI 小棋盤：每小時自動分析 AI 對弈、收發講評
name: 棋譜自動分析
on:
  schedule:
    - cron: '17,50 * * * *'   # 每小時第 17、50 分（50 分那輪趕快收 Claude 第 36 分寫好的講評）
  workflow_dispatch:           # Actions 頁面可以手動按「Run workflow」
concurrency:
  group: kifu-analyze
  cancel-in-progress: false    # 上一輪還在跑就排隊，不會兩輪同時拿同一盤
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: 線上頁面快取（Google 偶爾擋 GitHub 機器時用）
        uses: actions/cache@v4
        with:
          path: cache
          key: kifu-page-${{ github.run_id }}
          restore-keys: kifu-page-
      - name: 安裝瀏覽器
        run: npx playwright install --with-deps chromium
      - name: 分析＋收發講評
        env:
          KIFU_URL: ${{ secrets.KIFU_URL }}
          KIFU_KEY: ${{ secrets.KIFU_KEY }}
        run: node ci.js 40
